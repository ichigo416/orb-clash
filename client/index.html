<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orb Clash</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141824;
      --accent: #4ecdc4;
      --accent-2: #ff6b6b;
      --text: #e8ecf1;
      --text-dim: #8a93a6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container { position: absolute; inset: 0; }
    #menu-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1a2233 0%, #0b0e14 70%);
      z-index: 10;
    }
    #menu-overlay.hidden { display: none; }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      min-width: 340px;
    }
    .panel h1 {
      margin: 0 0 4px;
      font-size: 32px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .panel p.tag { margin: 0 0 24px; color: var(--text-dim); font-size: 14px; }

    .view.hidden-view { display: none; }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0e121b;
      color: var(--text);
      font-size: 15px;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }

    button { font-family: inherit; cursor: pointer; border: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .primary-btn {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      background: var(--accent);
      color: #06201d;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .primary-btn:hover:not(:disabled) { background: #5fe0d6; transform: translateY(-1px); }

    .secondary-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .secondary-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(78,205,196,0.08); }

    .link-btn {
      background: none;
      color: var(--text-dim);
      font-size: 12px;
      text-decoration: underline;
      padding: 4px;
      margin-top: 10px;
    }
    .link-btn:hover { color: var(--text); }

    .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

    .join-row { display: flex; gap: 8px; margin-top: 10px; }
    .join-row input { flex: 1; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
    .join-row button { width: auto; padding: 12px 18px; }

    #lobby-status, #status-line { margin-top: 12px; font-size: 12px; color: var(--text-dim); min-height: 16px; }
    #lobby-status.error { color: var(--accent-2); }

    #room-code-display {
      margin-bottom: 18px; padding: 12px; border-radius: 10px;
      background: rgba(78,205,196,0.08); border: 1px solid rgba(78,205,196,0.25);
    }
    #room-code-display .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    #room-code-display .code { font-size: 24px; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); margin: 4px 0; }
    #room-code-display .copy-hint { font-size: 11px; color: var(--text-dim); cursor: pointer; text-decoration: underline; }
    #play-view .primary-btn { margin-top: 14px; }
    #play-view input[type="text"] { margin-bottom: 0; }

    #top-scores { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; text-align: left; }
    #top-scores h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); text-align: center; }
    #top-scores-list { margin: 0; padding-left: 20px; font-size: 13px; max-height: 130px; overflow-y: auto; }
    #top-scores-list li { margin-bottom: 4px; }
    #top-scores-list li.dim { color: var(--text-dim); list-style: none; margin-left: -20px; text-align: center; }

    #hud {
      position: absolute; top: 16px; left: 16px;
      z-index: 5; pointer-events: none;
      font-size: 13px; color: var(--text-dim);
    }
    #leaderboard {
      position: absolute; top: 16px; right: 16px;
      z-index: 5; width: 190px;
      background: rgba(20,24,36,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(4px);
    }
    #leaderboard h3 {
      margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
    }
    #leaderboard ol { margin: 0; padding-left: 18px; font-size: 13px; }
    #leaderboard li { margin-bottom: 4px; }
    #leaderboard li.me { color: var(--accent); font-weight: 700; }

    #death-toast {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(230,57,70,0.15); border: 1px solid rgba(230,57,70,0.4);
      color: #ffb3b8; padding: 8px 18px; border-radius: 20px;
      font-size: 13px; z-index: 5; opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #death-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud"></div>
  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <ol id="leaderboard-list"></ol>
  </div>
  <div id="death-toast"></div>

  <div id="menu-overlay">
    <div class="panel">
      <h1>Orb Clash</h1>
      <p class="tag">Eat orbs. Absorb the small. Avoid the big.</p>

      <!-- Lobby: pick how you get into an arena -->
      <div id="lobby-view" class="view">
        <button id="quickplay-btn" class="primary-btn" disabled>Quick Play</button>
        <div class="divider">or</div>
        <button id="create-room-btn" class="secondary-btn" disabled>Create Room</button>
        <div class="join-row">
          <input id="join-code-input" type="text" maxlength="6" placeholder="Room code" />
          <button id="join-room-btn" class="secondary-btn" disabled>Join</button>
        </div>
        <div id="lobby-status">Connecting to server...</div>

        <div id="top-scores">
          <h3>All-Time Top Scores</h3>
          <ol id="top-scores-list"><li class="dim">Loading...</li></ol>
        </div>
      </div>

      <!-- Play: shown once a room has been assigned -->
      <div id="play-view" class="view hidden-view">
        <div id="room-code-display">
          <div class="label">Room Code</div>
          <div class="code" id="room-code-text">------</div>
          <div class="copy-hint" id="copy-code-btn">Click to copy</div>
        </div>
        <input id="name-input" type="text" maxlength="16" placeholder="Enter a name" />
        <button id="play-btn" class="primary-btn">Play</button>
        <div id="status-line"></div>
        <button id="back-to-lobby-btn" class="link-btn">&larr; Choose a different room</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
