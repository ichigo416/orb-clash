<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orb Clash</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141824;
      --accent: #4ecdc4;
      --accent-2: #ff6b6b;
      --text: #e8ecf1;
      --text-dim: #8a93a6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container { position: absolute; inset: 0; }
    #menu-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1a2233 0%, #0b0e14 70%);
      z-index: 10;
    }
    #menu-overlay.hidden { display: none; }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      min-width: 320px;
    }
    .panel h1 {
      margin: 0 0 4px;
      font-size: 32px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .panel p.tag { margin: 0 0 24px; color: var(--text-dim); font-size: 14px; }
    #name-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0e121b;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 14px;
    }
    #name-input:focus { outline: 2px solid var(--accent); }
    #play-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #06201d;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    #play-btn:hover { background: #5fe0d6; transform: translateY(-1px); }
    #play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #status-line { margin-top: 12px; font-size: 12px; color: var(--text-dim); min-height: 16px; }

    #hud {
      position: absolute; top: 16px; left: 16px;
      z-index: 5; pointer-events: none;
      font-size: 13px; color: var(--text-dim);
    }
    #leaderboard {
      position: absolute; top: 16px; right: 16px;
      z-index: 5; width: 190px;
      background: rgba(20,24,36,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(4px);
    }
    #leaderboard h3 {
      margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
    }
    #leaderboard ol { margin: 0; padding-left: 18px; font-size: 13px; }
    #leaderboard li { margin-bottom: 4px; }
    #leaderboard li.me { color: var(--accent); font-weight: 700; }

    #death-toast {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(230,57,70,0.15); border: 1px solid rgba(230,57,70,0.4);
      color: #ffb3b8; padding: 8px 18px; border-radius: 20px;
      font-size: 13px; z-index: 5; opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #death-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud"></div>
  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <ol id="leaderboard-list"></ol>
  </div>
  <div id="death-toast"></div>

  <div id="menu-overlay">
    <div class="panel">
      <h1>Orb Clash</h1>
      <p class="tag">Eat orbs. Absorb the small. Avoid the big.</p>
      <input id="name-input" type="text" maxlength="16" placeholder="Enter a name" />
      <button id="play-btn">Play</button>
      <div id="status-line"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
